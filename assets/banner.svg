<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Glow -->
    <radialGradient id="glow" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Canvas -->
  <rect width="880" height="200" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.2" />
  <rect width="880" height="200" rx="14" fill="url(#glow)" />

  <!-- Subtle Geometric Grid Accent -->
  <g opacity="0.08" stroke="#818cf8" stroke-width="1">
    <line x1="520" y1="0" x2="520" y2="200" stroke-dasharray="4 8" />
    <line x1="640" y1="0" x2="640" y2="200" stroke-dasharray="4 8" />
    <line x1="760" y1="0" x2="760" y2="200" stroke-dasharray="4 8" />
    <line x1="450" y1="65" x2="880" y2="65" stroke-dasharray="4 8" />
    <line x1="450" y1="135" x2="880" y2="135" stroke-dasharray="4 8" />
  </g>

  <!-- Dynamic Waves -->
  <path d="M420 200 C520 130 630 190 740 120 C800 80 840 90 880 70 L880 200 Z" fill="url(#wave1)" />
  <path d="M480 200 C580 110 700 170 800 100 C835 75 860 85 880 75 L880 200 Z" fill="url(#wave2)" />
  <path d="M440 200 C540 120 660 180 770 110 C820 80 855 85 880 70" stroke="url(#cyan-indigo)" stroke-width="1.6" stroke-opacity="0.45" fill="none" />
  <path d="M510 200 C610 140 710 185 810 125 C845 105 865 105 880 100" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" fill="none" />

  <!-- Floating Bento Capsules (Right side) -->
  <g transform="translate(620, 32)">
    <rect width="215" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="17.5" fill="#c9d1d9" font-size="12" font-weight="600" class="sans" dominant-baseline="central">IDEye · Vistax L2C Engine</text>
  </g>

  <g transform="translate(660, 78)">
    <rect width="175" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="18" cy="17" r="4.5" fill="#818cf8" />
    <text x="32" y="17.5" fill="#c9d1d9" font-size="12" font-weight="600" class="sans" dominant-baseline="central">702 tests · AGPL v3</text>
  </g>

  <g transform="translate(605, 124)">
    <rect width="230" height="34" rx="17" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="17.5" fill="#c9d1d9" font-size="12" font-weight="600" class="sans" dominant-baseline="central">Docente de Matemáticas</text>
  </g>

  <!-- Left Content Block -->
  <!-- Top Badge / Capsule -->
  <g transform="translate(40, 32)">
    <rect width="242" height="26" rx="13" fill="#161b22" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8" />
    <text x="27" y="13.5" fill="#38bdf8" font-size="10.5" font-weight="700" class="mono" letter-spacing="0.5" dominant-baseline="central">INGENIERÍA INFORMÁTICA · UIB</text>
  </g>

  <!-- Main Headline -->
  <text x="40" y="98" fill="#f0f6fc" font-size="32" font-weight="800" class="sans" letter-spacing="-0.5">
    Daniel Casado Juan
  </text>

  <!-- Subheadline / Focus Areas -->
  <text x="40" y="130" fill="#818cf8" font-size="14.5" font-weight="600" class="sans">
    Visión por Computador &amp; HCI · Sistemas Concurrentes
  </text>

  <!-- University / Location Subtext -->
  <text x="40" y="156" fill="#8b949e" font-size="13" class="sans">
    Universitat de les Illes Balears (UIB) · Palma de Mallorca
  </text>
</svg>
